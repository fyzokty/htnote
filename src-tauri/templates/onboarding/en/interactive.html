<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Note Example</title>
</head>
<body>
  <main id="htnote-content">
    <h1>Interactive Note Example</h1>
    <p>This counter shows how JavaScript and CSS can make a note interactive. The value is saved in your browser.</p>
    <div class="counter"><button id="decrease" type="button" aria-label="Decrease">−</button><output id="count" aria-live="polite">0</output><button id="increase" type="button" aria-label="Increase">+</button></div>
  </main>
</body>
</html>
