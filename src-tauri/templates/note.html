<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{HTNOTE_TITLE}}</title>
    {{HTNOTE_METADATA}}
    <style data-htnote="base">
      :where(html) { background: var(--ht-note-bg, var(--ht-bg, #fff)); color: var(--ht-text, #222); }
      :where(body) {
        font-family: var(--ht-font, system-ui, -apple-system, sans-serif);
        color: var(--ht-text, #222);
        background-color: var(--ht-bg, #fff);
        line-height: 1.6;
        max-width: 860px;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
      :where(img) { max-width: 100%; height: auto; border-radius: 8px; }
      :where(audio) { width: 100%; margin: 1rem 0; }
    </style>
  </head>
  <body>
    <main id="htnote-content">
      <h1>{{HTNOTE_TITLE}}</h1>
      <p></p>
    </main>
  </body>
</html>
