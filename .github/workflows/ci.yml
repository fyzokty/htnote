name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run verify:analyze
      - run: npm run verify:test
      - run: npm run verify:build

  e2e:
    needs: verify
    # https://github.com/actions/runner-images/issues/14738 çözülene kadar windows-2022 kullan; sonra yeniden değerlendir.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      # Older WebView2 runtimes have position-dependent WebDriver coordinate drift.
      # Update to Evergreen to match the runtime used in users' environments.
      - name: Update WebView2 Evergreen Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $client = '{F1E7E90C-7A49-42C8-A039-17D95E7E803D}'
          $runtimeRoot = 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application'
          function Get-RuntimeVersions {
            foreach ($hive in @('HKCU:\Software\Microsoft\EdgeUpdate\Clients', 'HKLM:\Software\Microsoft\EdgeUpdate\Clients', 'HKLM:\Software\WOW6432Node\Microsoft\EdgeUpdate\Clients')) {
              $key = Join-Path $hive $client
              $pv = (Get-ItemProperty -LiteralPath $key -Name pv -ErrorAction SilentlyContinue).pv
              $parsed = $null
              if ([version]::TryParse($pv, [ref]$parsed) -and $parsed -gt [version]'0.0.0.0') {
                Write-Host "WebView2 Runtime ($key): $pv"
                $parsed
              }
            }
          }
          function Get-RuntimeFolderVersion {
            Get-ChildItem -LiteralPath $runtimeRoot -Directory -ErrorAction SilentlyContinue |
              ForEach-Object {
                $parsed = $null
                if ([version]::TryParse($_.Name, [ref]$parsed)) { $parsed }
              } | Sort-Object -Descending | Select-Object -First 1
          }
          Write-Host 'WebView2 Runtime before update:'
          $before = @(Get-RuntimeVersions)
          $baseline = $before | Sort-Object -Descending | Select-Object -First 1
          Write-Host "Highest runtime folder before update: $(Get-RuntimeFolderVersion)"
          $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
          $installSucceeded = $false
          try {
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2124701' -OutFile $installer
            $setup = Start-Process -FilePath $installer -ArgumentList '/silent', '/install' -Wait -PassThru -WindowStyle Hidden
            $installSucceeded = $setup.ExitCode -eq 0
            if (-not $installSucceeded) { Write-Host "::warning::WebView2 installer exited with code $($setup.ExitCode); continuing with the available runtime." }
          } catch {
            Write-Host "::warning::WebView2 update failed: $($_.Exception.Message). Continuing with the available runtime."
          }
          # EdgeUpdate can outlive the installer; bound subprocess waiting separately.
          $processDeadline = (Get-Date).AddMinutes(5)
          do {
            $pending = @(Get-Process -ErrorAction SilentlyContinue | Where-Object {
              $_.ProcessName -in @('MicrosoftEdgeUpdate', 'MicrosoftEdgeUpdateSetup', 'MicrosoftEdgeWebView2RuntimeInstallerX64') -or
              ($_.ProcessName -eq 'setup' -and $_.Path -match 'Microsoft\\(EdgeUpdate|EdgeWebView)\\')
            })
            if ($pending.Count -eq 0 -or (Get-Date) -ge $processDeadline) { break }
            Start-Sleep -Seconds 10
          } while ($true)
          if ($pending.Count -gt 0) { Write-Host '::warning::WebView2 update processes are still running after five minutes; continuing with the available runtime.' }
          $deadline = (Get-Date).AddMinutes(5)
          do {
            $versions = @(Get-RuntimeVersions)
            $registered = $versions | Sort-Object -Descending | Select-Object -First 1
            $folderVersion = Get-RuntimeFolderVersion
            Write-Host "Highest runtime folder ($runtimeRoot): $folderVersion"
            $verified = $installSucceeded -and $pending.Count -eq 0 -and $registered -and
              $registered -eq $folderVersion -and (-not $baseline -or $registered -ge $baseline)
            if ($verified -or (Get-Date) -ge $deadline) { break }
            Start-Sleep -Seconds 10
          } while ($true)
          if (-not $verified) { Write-Host '::warning::Could not verify the updated WebView2 Runtime within five minutes; continuing with the available runtime and matching EdgeDriver.' }
          $available = if ($registered) { $registered } elseif ($folderVersion) { $folderVersion } else { $baseline }
          Write-Host "WebView2 Runtime before EdgeDriver matching: $available (update verified: $verified)"
          "WEBVIEW2_RUNTIME_VERSION=$available" >> $env:GITHUB_ENV
          "WEBVIEW2_UPDATE_VERIFIED=$verified" >> $env:GITHUB_ENV
      - name: Install WebView2-matched msedgedriver
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool msedgedriver-tool
          & "$env:USERPROFILE\.cargo\bin\msedgedriver-tool.exe"
          $driver = Join-Path $PWD.Path 'msedgedriver.exe'
          if (-not (Test-Path $driver)) { throw "msedgedriver-tool did not create $driver" }
          "MSEDGEDRIVER_PATH=$driver" >> $env:GITHUB_ENV
          $PWD.Path >> $env:GITHUB_PATH
      - name: Print WebDriver and WebView2 versions
        shell: pwsh
        run: |
          Write-Host "Pinned EdgeDriver: $env:MSEDGEDRIVER_PATH"
          & $env:MSEDGEDRIVER_PATH --version
          Write-Host 'EdgeDriver binaries on PATH:'
          where.exe msedgedriver
          Write-Host 'tauri-driver:'
          (Get-Command tauri-driver).Source
          tauri-driver --help
          $client = '{F1E7E90C-7A49-42C8-A039-17D95E7E803D}'
          foreach ($hive in @('HKCU:\Software\Microsoft\EdgeUpdate\Clients', 'HKLM:\Software\Microsoft\EdgeUpdate\Clients', 'HKLM:\Software\WOW6432Node\Microsoft\EdgeUpdate\Clients')) {
            $key = Join-Path $hive $client
            if (Test-Path $key) {
              Write-Host "WebView2 Runtime ($key): $((Get-ItemProperty $key).pv)"
            }
          }
      - name: Build debug app for diagnostics
        run: npx tauri build --debug --no-bundle
      - name: Diagnose app startup
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force e2e/logs | Out-Null
          $env:HTNOTE_ROOT_OVERRIDE = Join-Path $env:RUNNER_TEMP 'htnote-smoke-notes'
          $env:HTNOTE_CONFIG_DIR_OVERRIDE = Join-Path $env:RUNNER_TEMP 'htnote-smoke-config'
          $env:RUST_BACKTRACE = '1'
          New-Item -ItemType Directory -Force $env:HTNOTE_ROOT_OVERRIDE, $env:HTNOTE_CONFIG_DIR_OVERRIDE | Out-Null
          $stdout = Join-Path $PWD.Path 'e2e/logs/app-stdout.log'
          $stderr = Join-Path $PWD.Path 'e2e/logs/app-stderr.log'
          $app = Start-Process -FilePath (Join-Path $PWD.Path 'src-tauri/target/debug/htnote.exe') -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $windowOpened = $false
          $exitedEarly = $false
          try {
            $deadline = (Get-Date).AddSeconds(60)
            while ((Get-Date) -lt $deadline) {
              $app.Refresh()
              if ($app.HasExited) { break }
              if ($app.MainWindowHandle -ne 0) {
                $windowOpened = $true
                Write-Host "App window opened: $($app.MainWindowTitle)"
                Start-Sleep -Seconds 3
                $app.Refresh()
                break
              }
              Start-Sleep -Milliseconds 500
            }
            if ($app.HasExited) {
              $exitedEarly = $true
              Write-Host "App exited with code $($app.ExitCode)"
            } else {
              Write-Host "App still running after diagnostic; window opened: $windowOpened"
            }
          } finally {
            if (-not $app.HasExited) { taskkill.exe /PID $app.Id /T /F | Out-Null }
            $app.WaitForExit()
            Write-Host "App diagnostic final exit code: $($app.ExitCode)"
            Write-Host 'App stdout:'
            if (Test-Path $stdout) { Get-Content $stdout }
            Write-Host 'App stderr:'
            if (Test-Path $stderr) { Get-Content $stderr }
          }
          if (-not $windowOpened -or $exitedEarly) { throw 'App startup diagnostic failed' }
      - name: Run e2e specs
        run: npm run test:e2e
      - name: Upload e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: e2e/logs/
          if-no-files-found: warn
